[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."whatsapp-reminders"]
  schedule = "0 23 * * *"

[functions."weekly-awards"]
  schedule = "0 19 * * 5"

[[redirects]]
  from = "/api/coach"
  to = "/.netlify/functions/ruben-coach"
  status = 200

[[redirects]]
  from = "/api/evidence"
  to = "/.netlify/functions/evidence-articles"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://esm.sh; frame-src https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'"
